name: Daily Local LLM Research

on:
  schedule:
    # 23:00 UTC = 08:00 JST (next day)
    - cron: "0 23 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-local-llm-research
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Research and update wiki
        run: python scripts/research.py

      - name: Enrich model articles with primary metadata
        run: python scripts/enrich.py

      - name: Curate important news and summarize in Japanese
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.5-flash-lite
        run: python scripts/curate.py

      - name: Validate wiki data
        run: python scripts/healthcheck.py

      - name: Commit changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes."
            exit 0
          fi
          git config user.name "local-llm-wiki-bot"
          git config user.email "local-llm-wiki-bot@users.noreply.github.com"
          git add docs/data/wiki.json
          git commit -m "docs: daily Local LLM research $(date -u +%F)"
          git push
