name: Daily Local LLM Research

on:
  schedule:
    # 23:00 UTC = 08:00 JST (next day)
    - cron: "0 23 * * *"
  workflow_dispatch:

# Read-only by default. Only the final commit job receives write access.
permissions:
  contents: read

concurrency:
  group: daily-local-llm-research
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Research and update wiki
        run: python scripts/research.py

      - name: Curate important news and summarize in Japanese
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.5-flash-lite
        run: python scripts/curate.py

      - name: Validate wiki data
        run: python scripts/healthcheck.py

      - name: Upload validated wiki data
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: validated-wiki-data
          path: docs/data/wiki.json
          if-no-files-found: error
          retention-days: 1

  commit:
    needs: research
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Download validated wiki data
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: validated-wiki-data
          path: docs/data

      - name: Commit changes
        shell: bash
        run: |
          if git diff --quiet -- docs/data/wiki.json; then
            echo "No changes."
            exit 0
          fi
          git config user.name "local-llm-wiki-bot"
          git config user.email "local-llm-wiki-bot@users.noreply.github.com"
          git add -- docs/data/wiki.json
          git commit -m "docs: daily Local LLM research $(date -u +%F)"
          git push
